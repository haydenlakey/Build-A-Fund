# Unit trusts available on EasyEquities, curated by risk level (Phase 4).
#
# Edit freely: the app reads this file at start-up. Every fund names where each figure comes from.
#
# Which funds: all 28 are on EasyEquities' public unit trust list (sitemap of wealth.easyequities.co.za,
# read 2026-10-11). Funds were left out when their fact sheet gives no usable asset-class split
# (Bidvest Prime Preserver, 10X Stable Income, 27four Shari'ah Income, Harvard House BCI Property),
# when the sheet on EasyEquities belongs to a different fund (Sanlam Diversified Income), or when the
# PDF has no readable text (Fairtree Equity Prescient).
#
# Field guide
#   ticker      UT:<ISIN>. Price history (unit prices, in cents) comes from EasyEquities' public price
#               feed, the one its fund pages use. Unit prices fall when a fund pays out income, and the
#               feed doesn't add distributions back, so returns from it are understated by roughly the
#               fund's distribution yield (large for income funds, small for equity funds).
#   risk        low | low_medium | medium_high | high. Taken from the fund's own published risk label
#               (risk_label, and who published it). A plain "Medium" label, or no label, is resolved by
#               the ASISA category: interest-bearing and multi-asset income -> low; multi-asset low and
#               medium equity -> low_medium; multi-asset high equity and flexible -> medium_high;
#               equity and real estate -> high.
#   ter, tc     Annual, as fractions, for the class sold on EasyEquities, from its fund page (fees
#               block), else from the fact sheet (fees_src says which).
#   size        As shown on the EasyEquities fund page (read 2026-10-11) unless noted.
#   allocation  Percent of the fund by the app's asset classes (fundlab/synthetic.py ASSET_CLASSES),
#               mapped from the fact sheet's asset allocation table:
#                 - "hedged equities" (shares with their market exposure hedged away) -> cash
#                 - floating-rate notes and NCDs, where listed separately -> SA cash (their interest
#                   resets with short-term rates, so their prices barely move)
#                 - preference shares, credit-linked notes, fixed-rate and corporate bonds -> SA bonds
#                 - "domestic income" -> SA cash; "offshore/foreign" with no split -> global bonds
#                 - bonds in a "0-3 years" term bucket -> SA short-term bonds (sa_short_bonds), when the
#                   sheet splits the bond holdings themselves by term
#               Negative weights (derivative overlays) are kept as published.
#   holdings    Top holdings as [ticker or null, name, percent], ticker only where the same company is
#               in universe.yaml (for overlap). Omitted where the sheet gives no weights.
#   method      Default modelling method in the app: allocation_model for low and low_medium funds
#               (their unit prices miss most of the return, which is paid out as income), price_history
#               otherwise. The user can switch.
#   sheet       The fact sheet / minimum disclosure document (MDD) used: url, as_of (date of the data),
#               host (manager = the manager's own site; discovery = Discovery's investment platform
#               library, used when the manager's site has no newer copy; momentum = Momentum's
#               wealth platform fact sheet library, same use; easyequities = EasyEquities'
#               resource site, used when none of these is reachable or newer). Optional accessed
#               (the date the sheet was read) overrides the file-wide accessed date below.

accessed: 2026-10-11
ee_list: https://wealth.easyequities.co.za/sitemap.xml
ee_prices: https://pricing.easyequities.co.za/api/prices?ISINCode={isin}&period=0

risk_levels:
  low: {name: Low, blurb: "Money market, short-term interest and multi-asset income funds. Small, steady returns; capital rarely falls far."}
  low_medium: {name: Low to medium, blurb: "Cautious multi-asset funds: mostly bonds and cash with a minority in shares."}
  medium_high: {name: Medium to high, blurb: "Balanced and flexible funds: mostly shares, with bonds and cash to soften falls."}
  high: {name: High, blurb: "Equity and property funds: the highest long-run growth potential and the deepest falls."}

