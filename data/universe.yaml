# Preset universe for Build-a-Fund Lab.
#
# Edit freely: the app reads this file at start-up.
#
# Field guide
#   ticker    Yahoo Finance symbol. JSE securities end in .JO and are quoted in cents.
#   kind      jse_share | jse_etf | us_share | us_etf  (see fundlab/model.py)
#   sector    Yahoo/Morningstar sector names, so JSE and US holdings share one scheme:
#             Technology, Communication Services, Consumer Cyclical, Consumer Defensive,
#             Financial Services, Healthcare, Industrials, Basic Materials, Energy,
#             Real Estate, Utilities. ETFs use: Equity (broad), Bonds, Property, Commodity.
#   industry  Finer description (curated).
#   country   Where the company is domiciled / headquartered.
#   exposure  Where the money is actually made (curated judgement, approximate):
#               sa         mostly South African revenue and costs
#               sa_dollar  South African operations selling US-dollar-priced output (miners, Sasol)
#               africa     mostly African revenue outside South Africa
#               mixed      substantial South African and offshore revenue
#               global     mostly offshore revenue  (these are the "rand hedges")
#   themes    Free tags used by insight rules (e.g. ai, gold, pgm, tencent).
#   history_from  Optional date; earlier Yahoo history is ignored (bad or predecessor data).
#
# Sources
#   Top 40 membership: Satrix Top 40 product page, constituent table "as at 08 Oct 2026"
#     https://satrix.co.za/products/product-details?id=44  (accessed 2026-10-08).
#     It lists 41 lines because Investec has a Ltd (INL) and a PLC (INP) listing.
#   US sector/industry/country: Yahoo Finance via yfinance Ticker.info (accessed 2026-10-09).
#   US ETF expense ratios: Yahoo Finance netExpenseRatio (accessed 2026-10-09).
#   JSE sector, industry and exposure: curated for this app, guided by the ICB industry
#     column on the Satrix page above. Treat "exposure" as an approximation.
#   Ticker availability and history start dates: checked with yfinance on 2026-10-09.
#
#   JSE ETF costs (ter = total expense ratio, tc = transaction costs, as fractions; accessed 2026-10-09).
#     Satrix: monthly MDD, https://satrix.co.za/fund/mdd/<code>, 1-year column. 31 Aug 2026
#       (STX500 and STXFIN: 31 Jul 2026).
#     Sygnia Itrix: MDDs at https://www.itransact.co.za/Library/ITRANSACT%20MEDIA/FACT%20SHEETS/
#       (itrix_top40, itrix_sp500, itrix_msciusa, itrix_msciworld, itrix_mscijapan), 31 Jul 2026,
#       ratios "Jun 2026". SYGEU from the EasyEquities copy, 31 Dec 2025. For SYGUS, SYGWD,
#       SYGJP and SYGEU the "Broker/Other Platform" column is used (what an EasyEquities buyer
#       pays); Sygnia's own Alchemy platform is cheaper (e.g. SYGUS 0.65% vs 0.89%).
#     10X: MDDs at https://assetmanagement.10x.co.za/wp-content/uploads/2026/08/ , 31 Jul 2026.
#     1nvest: MDDs at https://resources.easyequities.co.za/ETFs/ETF%20Factsheets/1nvest/<code>.pdf,
#       "1 Year Total Expense". ETFT40 and ETF500 31 Dec 2025, ETFSWX 31 Oct 2025 (older:
#       newer copies on etfsa.co.za refuse automated downloads). ETFGLD: 0.25% management
#       fee excluding VAT (the sheet gives no TER), 31 Dec 2025.
#     NewGold (GLD, NGPLT): "Annual Sales Charge" from the EasyEquities copies,
#       https://resources.easyequities.co.za/ETFs/ETF%20Factsheets/ABSA/<code>.pdf, 31 Dec 2025.
#       The sheet gives no separate TER figure.
#   Look-through (holdings, sectors, countries): data/lookthrough.yaml, with a source per entry.

