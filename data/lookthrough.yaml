# Look-through data for ETFs: what each fund actually holds.
#
# Edit freely: the app reads this file at start-up. Every block names its source and date.
# Costs (ter, tc) live on each ETF's line in universe.yaml; this file holds the contents.
#
# Field guide (one entry per ETF ticker, or per index under "index:<name>")
#   use         Inherit any field this entry leaves out from another entry
#               (usually the index the ETF tracks). Own fields always win.
#   asset       Asset class: equity | bonds | property | commodity | cash
#   sectors     {label: percent} as published. Labels are mapped to the app's sectors by
#               sector_map below; unknown labels show as "Other". The published label is kept
#               as the finer "industry" level in charts.
#   holdings    Top holdings as [ticker, name, percent]. ticker is a Yahoo symbol (null if
#               unknown); a ticker that is also in universe.yaml lets the app spot overlap.
#               Only the top 10 (or fewer) are published, so this is partial by design.
#   countries   {ISO country code or "Other": percent}. For JSE equity funds this means
#               "JSE-listed"; the app refines it with the countries of the top holdings.
#   sectors_src / holdings_src / countries_src
#               {url, as_of (date of the data), accessed (date we read it), note (optional)}
#
# Percentages need not sum to exactly 100 (rounding); the app rescales.
#
# Source notes
#   Satrix sector splits come from the "Constituent industries" table on each product page
#   (ICB supersectors for most SA equity funds), shown "As On 09 Oct 2026". Satrix top
#   holdings come from the monthly Minimum Disclosure Document (MDD) at
#   https://satrix.co.za/fund/mdd/<JSE code>, which redirects to the current PDF.
#   Offshore index sector splits use a US-listed ETF on the same index as a proxy, read from
#   Yahoo Finance (Morningstar sector data via yfinance funds_data), so they share the
#   Morningstar sector names used everywhere else in the app.
#   Some providers' latest MDDs could not be downloaded (etfsa.co.za refuses automated
#   access; 1nvest and NewGold sites block it). For those funds the newest copy on
#   EasyEquities' resource site is used, and its date is recorded. It is older.

as_of: 2026-10-09

# Published sector label (upper-cased for matching) -> app sector.
sector_map:
  # ICB supersectors (Satrix pages)
  BASIC RESOURCES: Basic Materials
  CHEMICALS: Basic Materials
  CONSTRUCTION & MATERIALS: Industrials
  INDUSTRIAL GOODS & SEVICES: Industrials        # Satrix's spelling
  INDUSTRIAL GOODS & SERVICES: Industrials
  BANKS: Financial Services
  INSURANCE: Financial Services
  FINANCIAL SERVICES: Financial Services
  REAL ESTATE: Real Estate
  TECHNOLOGY: Technology
  TELECOMMUNICATIONS: Communication Services
  MEDIA: Communication Services
  HEALTH CARE: Healthcare
  PERSONAL CARE DRUG AND GROCERY STORES: Consumer Defensive
  FOOD BEVERAGE AND TOBACCO: Consumer Defensive
  CONSUMER PRODUCTS AND SERVICES: Consumer Cyclical
  RETAIL: Consumer Cyclical
  TRAVEL & LEISURE: Consumer Cyclical
  AUTOMOBILES AND PARTS: Consumer Cyclical
  ENERGY: Energy
  UTILITIES: Utilities
  # ICB industries (Satrix Momentum / INDI pages, 10X sheets)
  BASIC MATERIALS: Basic Materials
  FINANCIALS: Financial Services
  CONSUMER STAPLES: Consumer Defensive
  CONSUMER DISCRETIONARY: Consumer Cyclical
  INDUSTRIALS: Industrials
  # Property sub-sectors (10X)
  DIVERSIFIED REITS: Real Estate
  RETAIL REITS: Real Estate
  INDUSTRIAL REITS: Real Estate
  STORAGE REITS: Real Estate
  REAL ESTATE HOLDING AND DEVELOPMENT: Real Estate
  # Bonds and commodities
  GOVERNMENT BONDS: Government bonds
  INFLATION-LINKED GOVERNMENT BONDS: Government bonds
  US BONDS (GOVERNMENT AND CORPORATE): Government and corporate bonds
  GOLD: Precious metals
  PLATINUM: Precious metals
  # Morningstar names map to themselves
  COMMUNICATION SERVICES: Communication Services
  CONSUMER CYCLICAL: Consumer Cyclical
  CONSUMER DEFENSIVE: Consumer Defensive
  HEALTHCARE: Healthcare

# Country -> currency the underlying assets are priced in.
currency_of_country:
  ZA: ZAR
  US: USD
  JP: JPY
  GB: GBP
  CA: CAD
  CN: CNY/HKD
  TW: TWD
  KR: KRW
  IN: INR
  BR: BRL
  CH: CHF
  NL: EUR
  FR: EUR
  DE: EUR
  ES: EUR
  IT: EUR
  BE: EUR
  IE: EUR
  LU: EUR
  RO: EUR       # NEPI Rockcastle: assets in Central/Eastern Europe, reports in EUR
  Other: Other

